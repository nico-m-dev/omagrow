  <path d="M28 124 Q100 113 172 124" fill="none" stroke="#8a5f42" stroke-width="6" stroke-linecap="round"/>
  <path d="M34 146 Q52 143 70 146 M126 150 Q146 147 164 149" fill="none" stroke="#4e3524" stroke-width="4" stroke-linecap="round" opacity=".8"/>

  <!-- left sprout -->
