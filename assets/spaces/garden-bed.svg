    <path d="M62 108 C80 108 90 98 90 82 C72 82 62 92 62 108 Z" fill="#8cc152"/>
  </g>

  <!-- middle sprout, tallest -->
  <path d="M102 140 V76" fill="none" stroke="#2f5d1f" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#2f5d1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M102 100 C80 100 68 86 68 66 C90 66 102 80 102 100 Z" fill="#62a63a"/>
    <path d="M102 90 C124 90 136 76 136 56 C114 56 102 70 102 90 Z" fill="#8cc152"/>
  </g>
  <path d="M74 78 C82 84 92 90 102 94" fill="none" stroke="#3f7d2a" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>

  <!-- right sprout -->
  <path d="M142 140 V94" fill="none" stroke="#2f5d1f" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#2f5d1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M142 112 C124 112 114 102 114 86 C132 86 142 96 142 112 Z" fill="#8cc152"/>
    <path d="M142 104 C160 104 170 94 170 78 C152 78 142 88 142 104 Z" fill="#62a63a"/>
  </g>

  <!-- soil texture and pebbles -->
  <path d="M24 138 Q36 134 50 137" fill="none" stroke="#8a5f42" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="170" cy="140" rx="6" ry="3.5" fill="#9a958c" stroke="#3b2a1f" stroke-width="4"/>
  <ellipse cx="80" cy="158" rx="5" ry="3" fill="#9a958c" stroke="#3b2a1f" stroke-width="4"/>
  <path d="M40 162 Q58 158 74 161" fill="none" stroke="#8a5f42" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
