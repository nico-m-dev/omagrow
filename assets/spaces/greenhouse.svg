<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- glass house -->
  <path d="M30 88 L100 34 L170 88 V170 H30 Z" fill="#bfe4d2" stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M20 92 L100 30 L180 92" fill="none" stroke="#3b2a1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- depth: shaded glass on the right -->
  <path d="M100 40 L164 88 V164 H100 Z" fill="#a5d4c0" opacity=".55"/>

  <!-- pane divisions -->
  <g fill="none" stroke="#4f7d6d" stroke-width="4" stroke-linecap="round">
    <path d="M100 34 V170"/>
    <path d="M30 88 H170"/>
    <path d="M30 132 H170"/>
    <path d="M64 66 L64 88 M136 66 L136 88"/>
    <path d="M64 132 V170 M136 132 V170"/>
  </g>

  <!-- plant inside -->
  <path d="M54 170 V140" fill="none" stroke="#2f5d1f" stroke-width="6" stroke-linecap="round"/>
  <path d="M54 150 C42 150 36 143 36 132 C48 132 54 139 54 150 Z" fill="#62a63a" stroke="#2f5d1f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M54 144 C66 144 72 137 72 126 C60 126 54 133 54 144 Z" fill="#8cc152" stroke="#2f5d1f" stroke-width="5" stroke-linejoin="round"/>

  <!-- door -->
  <rect x="84" y="116" width="32" height="54" rx="2" fill="#93cab5" stroke="#3b2a1f" stroke-width="5"/>
  <path d="M91 143 H109" fill="none" stroke="#3b2a1f" stroke-width="4" stroke-linecap="round"/>

  <!-- glass highlights -->
  <path d="M42 84 L70 56" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <path d="M158 104 L132 78" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".4"/>

  <!-- base -->
  <path d="M18 170 H182" fill="none" stroke="#3b2a1f" stroke-width="6" stroke-linecap="round"/>
  <path d="M28 178 H172" fill="none" stroke="#6b4220" stroke-width="5" stroke-linecap="round"/>
</svg>
